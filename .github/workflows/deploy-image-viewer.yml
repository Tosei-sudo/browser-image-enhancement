name: Deploy image viewer

# Deploys usecase/image-viewer to the VPS once CI passes on the default branch
# (i.e. after a merge), or on demand from the Actions tab.
#
# Uploads over SFTP (SSH, password login) with lftp. Repository secrets:
#   VPS_HOST                       host name or IP of the server
#   VPS_USER / VPS_USER_PASSWORD   SSH login
#   IMAGE_VIEWER_DEPLOY_DIRECTORY  directory the site is served from (created if missing;
#                                  a relative path is relative to the user's home)
#   VPS_PORT                       optional, SSH port (default 22)
#
# public/config.json is only uploaded when the server has none, so edits made on
# the server survive later deploys.
#
# Each deploy also packs the site into a zip for closed networks
# (image-viewer-<YYYYMMDD>-<commit>.zip, scripts/package.mjs): kept as an
# artifact of the run, and on the server as download/image-viewer.zip.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [claude/project-thread-ro9smf]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-image-viewer
  cancel-in-progress: false

jobs:
  deploy:
    # A workflow_run only deploys a push to the default branch whose CI passed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Builds the libraries first, then the viewer (workspace order).
      - run: npm run build
      # The zip to carry into a closed network.
      - id: package
        run: npm run package -w usecase/image-viewer
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.zip }}
          # The zip already is one: download it as it is.
          compression-level: 0
          retention-days: 90
      # The latest one on the server too, beside the site (not part of the offline cache).
      - run: mkdir -p usecase/image-viewer/dist/download && cp "${{ steps.package.outputs.zip }}" usecase/image-viewer/dist/download/image-viewer.zip
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Upload to the VPS
        env:
          # lftp --env-password reads it from here, so it never shows on a command line or in the log.
          LFTP_PASSWORD: ${{ secrets.VPS_USER_PASSWORD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          DEPLOY_DIR: ${{ secrets.IMAGE_VIEWER_DEPLOY_DIRECTORY }}
        run: |
          set -eu
          for name in VPS_HOST VPS_USER LFTP_PASSWORD DEPLOY_DIR; do
            if [ -z "${!name}" ]; then echo "::error::Secret for $name is not set."; exit 1; fi
          done
          dir="${DEPLOY_DIR%/}"
          # lftp prints the resolved address in its log; keep it out of the job output too.
          for ip in $(getent ahosts "$VPS_HOST" | awk '{print $1}' | sort -u); do echo "::add-mask::$ip"; done
          # 1st mirror: everything but config.json; --delete removes files of older builds
          # (the excluded config.json is left alone).
          # 2nd mirror: config.json only when the server has none yet.
          # sftp:auto-confirm accepts the server's host key on first contact (each runner is fresh).
          # The session log is printed only on failure; it never contains the password.
          log="$RUNNER_TEMP/lftp.log"
          if ! lftp -c "
            debug -o $log 5
            set cmd:fail-exit yes
            set net:max-retries 2
            set net:timeout 20
            set net:reconnect-interval-base 5
            set sftp:auto-confirm yes
            open -p ${VPS_PORT:-22} -u \"$VPS_USER\" --env-password \"sftp://$VPS_HOST\"
            mkdir -p -f \"$dir\"
            mirror -R --delete --no-perms --verbose=1 --exclude-glob config.json usecase/image-viewer/dist/ \"$dir/\"
            mirror -R --only-missing --no-perms --verbose=1 --include-glob config.json usecase/image-viewer/dist/ \"$dir/\"
          "; then
            echo "::group::SFTP log (last 80 lines)"
            tail -n 80 "$log"
            echo "::endgroup::"
            exit 1
          fi
          echo "Deployed $(git rev-parse --short HEAD)."

name: Deploy image viewer

# Deploys usecase/image-viewer to the VPS once CI passes on the default branch
# (i.e. after a merge), or on demand from the Actions tab.
#
# Uploads over FTP with lftp (FTPS via AUTH TLS when the server offers it,
# plain FTP otherwise). Repository secrets:
#   VPS_HOST                       host name or IP of the server
#   VPS_USER / VPS_USER_PASSWORD   FTP login
#   IMAGE_VIEWER_DEPLOY_DIRECTORY  directory the site is served from, as the FTP
#                                  user sees it (created if missing)
#   VPS_PORT                       optional, FTP port (default 21)
#
# public/config.json is only uploaded when the server has none, so edits made on
# the server survive later deploys.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [claude/project-thread-ro9smf]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-image-viewer
  cancel-in-progress: false

jobs:
  deploy:
    # A workflow_run only deploys a push to the default branch whose CI passed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Builds the libraries first, then the viewer (workspace order).
      - run: npm run build
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Upload to the VPS
        env:
          # lftp --env-password reads it from here, so it never shows on a command line or in the log.
          LFTP_PASSWORD: ${{ secrets.VPS_USER_PASSWORD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          DEPLOY_DIR: ${{ secrets.IMAGE_VIEWER_DEPLOY_DIRECTORY }}
        run: |
          set -eu
          for name in VPS_HOST VPS_USER LFTP_PASSWORD DEPLOY_DIR; do
            if [ -z "${!name}" ]; then echo "::error::Secret for $name is not set."; exit 1; fi
          done
          dir="${DEPLOY_DIR%/}"
          # lftp prints the resolved address in its log; keep it out of the job output too.
          for ip in $(getent ahosts "$VPS_HOST" | awk '{print $1}' | sort -u); do echo "::add-mask::$ip"; done
          # 1st mirror: everything but config.json; --delete removes files of older builds
          # (the excluded config.json is left alone).
          # 2nd mirror: config.json only when the server has none yet.
          # Self-signed certificates are common on VPS FTP servers, so the TLS certificate is not verified.
          # ftp:ignore-pasv-address: servers behind NAT often answer PASV with a private address;
          # the data connection then goes to the address the control connection uses.
          # The FTP dialog goes to a log that is printed only on failure (lftp masks PASS).
          log="$RUNNER_TEMP/lftp.log"
          if ! lftp -c "
            debug -o $log 5
            set cmd:fail-exit yes
            set net:max-retries 2
            set net:timeout 20
            set net:reconnect-interval-base 5
            set ftp:ssl-allow yes
            set ssl:verify-certificate no
            set ftp:ignore-pasv-address yes
            open -p ${VPS_PORT:-21} -u \"$VPS_USER\" --env-password \"$VPS_HOST\"
            mkdir -p -f \"$dir\"
            mirror -R --delete --no-perms --verbose=1 --exclude-glob config.json usecase/image-viewer/dist/ \"$dir/\"
            mirror -R --only-missing --no-perms --verbose=1 --include-glob config.json usecase/image-viewer/dist/ \"$dir/\"
          "; then
            echo "::group::FTP log (last 80 lines)"
            tail -n 80 "$log"
            echo "::endgroup::"
            exit 1
          fi
          echo "Deployed $(git rev-parse --short HEAD)."

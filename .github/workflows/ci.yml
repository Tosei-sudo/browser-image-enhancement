name: CI

on:
  push:
    branches: [main, master, 'claude/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # dist/ is committed so jsDelivr can serve it from GitHub; it must match the sources.
      - run: npm run build
      - name: Check dist/ is up to date
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git status --porcelain -- dist
            echo "::error::dist/ does not match the sources. Run npm run build and commit dist/."
            exit 1
          fi
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          CI: true

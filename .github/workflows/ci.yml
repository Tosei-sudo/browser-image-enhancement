name: CI

# Pull requests run here, and pushes to the default branch (its runs drive the
# image viewer deploy). Pushes to other branches wait for their pull request,
# so one commit is not tested twice.
on:
  push:
    branches: [main, master, claude/project-thread-ro9smf]
  pull_request:
  workflow_dispatch:

# A newer push to the same pull request cancels the run it makes stale.
# Default-branch runs always finish (each one may deploy).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lint, types, docs, unit tests and the committed dist/.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Every exported API must have a doc comment and valid {@link}s (TypeDoc warnings fail).
      - run: npm run docs:check
      - run: npm test
      # Each package's dist/ is committed so jsDelivr can serve it from GitHub; it must match the sources.
      - run: npm run build
      - name: Check dist/ is up to date
        run: |
          if [ -n "$(git status --porcelain -- 'packages/*/dist')" ]; then
            git status --porcelain -- 'packages/*/dist'
            echo "::error::dist/ does not match the sources. Run npm run build and commit dist/."
            exit 1
          fi

  # Browser tests of the libraries (packages/*).
  browser-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser -w packages/browser-image-enhancement -w packages/browser-image-geometry
        env:
          CI: true

  # Browser tests of the image viewer, spread over runners. The 3D view's tests
  # (globe*.spec.ts) take minutes each on the software renderer, so they get
  # runners of their own, one test group per shard; the rest share two.
  # --grep and --grep-invert of the same pattern split the suite exactly.
  browser-viewer:
    name: browser-viewer (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 3D 1/3, filter: --grep, shard: 1/3 }
          - { name: 3D 2/3, filter: --grep, shard: 2/3 }
          - { name: 3D 3/3, filter: --grep, shard: 3/3 }
          - { name: 2D 1/2, filter: --grep-invert, shard: 1/2 }
          - { name: 2D 2/2, filter: --grep-invert, shard: 2/2 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser -w usecase/image-viewer -- ${{ matrix.filter }} 'globe(-tools)?\.spec\.ts' --shard=${{ matrix.shard }}
        env:
          CI: true

  # The one check to require: passes when every job above did.
  test:
    if: always()
    needs: [check, browser-packages, browser-viewer]
    runs-on: ubuntu-latest
    steps:
      - name: All CI jobs passed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = true ]; then
            echo "::error::A CI job did not pass."
            exit 1
          fi

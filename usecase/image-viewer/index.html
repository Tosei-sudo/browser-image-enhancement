<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>画像ビューア</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div class="app">
      <header class="bar">
        <h1>画像ビューア</h1>
        <div id="open" class="open"></div>
        <button type="button" id="add-service" class="bar-button">サービスを追加</button>
        <div id="basemap"></div>
        <form id="jump" class="jump" role="search">
          <input type="text" name="coordinate" placeholder="緯度経度・MGRS・UTM" aria-label="座標へ移動" autocomplete="off" />
          <button type="submit" class="bar-button">移動</button>
        </form>
        <div class="measure-tools" role="group" aria-label="計測">
          <button type="button" id="measure-distance" aria-pressed="false" title="測地線（WGS 84 楕円体）で距離を測ります">距離を測る</button>
          <button type="button" id="measure-area" aria-pressed="false" title="WGS 84 楕円体上の面積を測ります">面積を測る</button>
          <button type="button" id="measure-clear">計測を消去</button>
        </div>
        <div class="point-tools">
          <button type="button" id="add-point" aria-pressed="false">ポイント追加</button>
          <button type="button" id="save-points">GeoJSON 保存</button>
        </div>
      </header>
      <aside class="side">
        <section aria-labelledby="images-title">
          <h2 id="images-title">レイヤー</h2>
          <ol id="images" class="images"></ol>
          <p id="empty" class="empty">
            左上のボタンでローカルの画像・GeoTIFF・Shapefile・GeoJSON・GeoPackage を選ぶか、COG の URL を入力してください。表示エリアへのドラッグ＆ドロップでも開けます。「サービスを追加」で WMS・WMTS・WFS・Esri フィーチャーサービスのレイヤーも重ねられます。
          </p>
        </section>
        <section aria-labelledby="points-title">
          <h2 id="points-title">ポイント</h2>
          <ol id="points" class="points"></ol>
        </section>
        <section aria-labelledby="geometry-title">
          <h2 id="geometry-title">幾何補正</h2>
          <div id="geometry" class="geometry"></div>
        </section>
        <section aria-labelledby="info-title">
          <h2 id="info-title">情報</h2>
          <dl id="info" class="info"></dl>
        </section>
        <p id="build" class="build"></p>
      </aside>
      <main id="map" class="map"></main>
      <section id="table" class="table" aria-label="属性テーブル"></section>
      <p id="status" class="status" role="status"></p>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>画像ビューア</title>
    <!-- An installable app (PWA) that opens .ivproj project files: src/pwa.ts, sw.js. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#1e3a5f" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div class="app">
      <header class="bar">
        <h1>画像ビューア</h1>
        <div id="open" class="open"></div>
        <!-- The layers, styles, corrections and view as one .ivproj file: src/project.ts. -->
        <div class="menu project-menu" id="project-menu">
          <button type="button" class="bar-button menu-button" aria-haspopup="true" aria-expanded="false" aria-controls="project-panel">プロジェクト</button>
          <div id="project-panel" class="menu-panel" role="group" aria-label="プロジェクト" hidden>
            <div class="point-tools project-tools">
              <button type="button" id="project-open" title="保存したプロジェクト（.ivproj）を開きます">開く…</button>
              <button type="button" id="project-save" aria-keyshortcuts="Control+S" title="開いているレイヤー・スタイル・補正・表示範囲を保存します（Ctrl+S）">保存</button>
              <button type="button" id="project-save-as" aria-keyshortcuts="Control+Shift+S" title="別のファイルに保存します（Ctrl+Shift+S）">名前を付けて保存…</button>
            </div>
          </div>
        </div>
        <button type="button" id="add-service" class="bar-button">サービスを追加</button>
        <!-- Shown when config.json lists image catalogs: src/catalog-panel.ts. -->
        <button type="button" id="catalog-open" class="bar-button" title="画像カタログから撮像日・センサー・角度で画像を探して開きます" hidden>画像カタログ</button>
        <div id="basemap"></div>
        <!-- The 3D view (CesiumJS, loaded on first use): src/globe-panel.ts, src/globe.ts. -->
        <button type="button" id="globe-toggle" class="bar-button" aria-pressed="false" data-key="3" aria-keyshortcuts="3" title="立体（3D）表示に切り替えます（3）">3D</button>
        <form id="jump" class="jump" role="search">
          <input type="text" name="coordinate" placeholder="緯度経度・MGRS・UTM" aria-label="座標へ移動" autocomplete="off" />
          <button type="submit" class="bar-button">移動</button>
        </form>
        <!-- Everyday controls stay in the bar; the click tools and the rest are one menu away. -->
        <div class="menu" id="tools-menu">
          <button type="button" class="bar-button menu-button" aria-haspopup="true" aria-expanded="false" aria-controls="tools-panel">ツール</button>
          <div id="tools-panel" class="menu-panel" role="group" aria-label="ツール" hidden>
            <p class="menu-heading">計測</p>
            <div class="measure-tools" role="group" aria-label="計測">
              <button type="button" id="measure-distance" aria-pressed="false" data-key="D" aria-keyshortcuts="D" title="測地線（WGS 84 楕円体）で距離を測ります">距離を測る</button>
              <button type="button" id="measure-area" aria-pressed="false" data-key="A" aria-keyshortcuts="A" title="WGS 84 楕円体上の面積を測ります">面積を測る</button>
              <button type="button" id="measure-clear">計測を消去</button>
            </div>
            <p class="menu-heading">ポイント</p>
            <div class="point-tools">
              <button type="button" id="add-point" aria-pressed="false" data-key="P" aria-keyshortcuts="P">ポイント追加</button>
              <button type="button" id="save-points">GeoJSON 保存</button>
            </div>
            <p class="menu-heading">解析</p>
            <div class="point-tools">
              <button type="button" id="processing" title="バッファ・ポイント→ライン・重心・ボロノイ・ティーセン・投影変換・パンシャープン">プロセッシング</button>
            </div>
            <p class="menu-heading">時間・集計</p>
            <div class="point-tools">
              <button type="button" id="timeline-open" aria-pressed="false" data-key="T" aria-keyshortcuts="T" title="時間を持つレイヤーを時間軸に並べ、期間で絞り込みます（T）">タイムライン</button>
              <button type="button" id="dashboard-open" aria-pressed="false" data-key="B" aria-keyshortcuts="B" title="件数・属性別の集計・数値の分布・時間の推移・ヒートマップ。グラフをクリックすると地図とテーブルを絞り込みます（B）">ダッシュボード</button>
            </div>
            <p class="menu-heading">保存</p>
            <div class="point-tools">
              <button type="button" id="save-view" title="表示範囲を PNG・GeoTIFF で保存します">表示範囲を保存</button>
            </div>
          </div>
        </div>
        <button type="button" id="help" class="bar-button help-button" aria-keyshortcuts="Shift+?" title="使い方とショートカット（?）">?</button>
      </header>
      <aside class="side">
        <section aria-labelledby="images-title">
          <h2 id="images-title">レイヤー</h2>
          <ol id="images" class="images"></ol>
          <p id="empty" class="empty">
            左上のボタンでローカルの画像・GeoTIFF・Shapefile・GeoJSON・GeoPackage・CSV を選ぶか、COG の URL を入力してください。表示エリアへのドラッグ＆ドロップでも開けます。「サービスを追加」で WMS・WMTS・WFS・Esri フィーチャーサービスのレイヤーも重ねられます。
          </p>
        </section>
        <details class="fold" data-fold="globe" id="globe-section" open hidden>
          <summary><h2 id="globe-title">3D</h2></summary>
          <div id="globe" class="globe-panel"></div>
        </details>
        <details class="fold" data-fold="points" open>
          <summary><h2 id="points-title">ポイント</h2></summary>
          <ol id="points" class="points"></ol>
        </details>
        <details class="fold" data-fold="geometry">
          <summary><h2 id="geometry-title">幾何補正</h2></summary>
          <div id="geometry" class="geometry"></div>
        </details>
        <details class="fold" data-fold="info" open>
          <summary><h2 id="info-title">情報</h2></summary>
          <dl id="info" class="info"></dl>
          <button id="metadata-open" type="button" class="metadata-open" hidden>メタデータを表示…</button>
          <div class="analysis-tools" role="group" aria-label="比較・分析">
            <button id="swipe" type="button" aria-pressed="false" title="選択中のレイヤーを線の片側だけに表示し、下のレイヤーと見比べます">スワイプ比較</button>
            <button id="histogram-open" type="button" aria-pressed="false" title="選択中の画像の、表示範囲のヒストグラム">ヒストグラム</button>
          </div>
          <div id="histogram"></div>
        </details>
        <p id="build" class="build"></p>
      </aside>
      <div id="side-resize" class="side-resize"></div>
      <main id="map" class="map"></main>
      <!-- Filtering every layer by a window of time: src/timeline.ts. -->
      <section id="timeline" aria-label="タイムライン" hidden></section>
      <!-- Counts, charts and a heatmap of a layer, beside the map: src/dashboard.ts. -->
      <aside id="dashboard" aria-label="ダッシュボード" hidden></aside>
      <div id="dashboard-resize" class="dashboard-resize"></div>
      <section id="table" class="table" aria-label="属性テーブル"></section>
      <p id="status" class="status" role="status"></p>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>画像ビューア</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div class="app">
      <header class="bar">
        <h1>画像ビューア</h1>
        <div id="open" class="open"></div>
        <label class="basemap"><input type="checkbox" id="basemap" checked /> 背景地図</label>
      </header>
      <aside class="side">
        <section aria-labelledby="images-title">
          <h2 id="images-title">画像</h2>
          <ol id="images" class="images"></ol>
          <p id="empty" class="empty">
            左上のボタンでローカルの画像・GeoTIFF を選ぶか、COG の URL を入力してください。地図へのドラッグ＆ドロップでも開けます。
          </p>
        </section>
        <section aria-labelledby="info-title">
          <h2 id="info-title">情報</h2>
          <dl id="info" class="info"></dl>
        </section>
      </aside>
      <main id="map" class="map"></main>
      <p id="status" class="status" role="status"></p>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
